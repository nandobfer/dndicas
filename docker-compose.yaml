services:
  dndicas:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        - AUTH_URL=${AUTH_URL}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    image: nandoburgos/dndicas
    container_name: ${COMPOSE_PROJECT_NAME:-dndicas}
    restart: always
    ports:
      - "${PORT:-4005}:4005"
    env_file:
      - .env
    environment:
      - PUSHER_HOST=soketi
      - PUSHER_PORT=6001
      - PUSHER_SCHEME=http
    networks:
      - mongodb-network
      - minio-network
      - soketi-network

networks:
  mongodb-network:
    external: true
  minio-network:
    external: true
  soketi-network:
    external: true
