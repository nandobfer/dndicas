services:
  dndicas:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        - AUTH_URL=${AUTH_URL}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    image: nandoburgos/dndicas
    container_name: dndicas
    restart: always
    ports:
      - "${PORT:-4005}:4005"
    # Opcional: worktrees de prévia (ex.: Opex) não têm `.env`; o build injeta valores dummy
    # e o runtime recebe as variáveis pelo ambiente quando o arquivo não existe.
    env_file:
      - path: .env
        required: false
    environment:
      - PUSHER_HOST=soketi
      - PUSHER_PORT=6001
      - PUSHER_SCHEME=http
    networks:
      - mongodb-network
      - minio-network
      - soketi-network

networks:
  mongodb-network:
    external: true
  minio-network:
    external: true
  soketi-network:
    external: true
